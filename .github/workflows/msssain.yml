      - name: Verify RDP Administrator Permissions
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $username = $env:RDP_USERNAME
          $user = Get-LocalUser -Name $username

          if (-not $user) {
              throw "RDP account does not exist."
          }

          $sid = $user.SID.Value

          $adminGroup = Get-LocalGroup -SID "S-1-5-32-544"
          $rdpGroup = Get-LocalGroup -SID "S-1-5-32-555"

          $adminMember = Get-LocalGroupMember -Group $adminGroup.Name |
              Where-Object { $_.SID.Value -eq $sid }

          $rdpMember = Get-LocalGroupMember -Group $rdpGroup.Name |
              Where-Object { $_.SID.Value -eq $sid }

          if (-not $adminMember) {
              throw "RDP account is NOT an Administrator."
          }

          if (-not $rdpMember) {
              throw "RDP account is NOT in Remote Desktop Users."
          }

          Write-Host "===================================="
          Write-Host "RDP PERMISSIONS VERIFIED"
          Write-Host "===================================="
          Write-Host "Username: $username"
          Write-Host "Administrator: YES"
          Write-Host "Remote Desktop Users: YES"
          Write-Host "Account enabled: $($user.Enabled)"
          Write-Host "===================================="
