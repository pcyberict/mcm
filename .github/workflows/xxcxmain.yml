
name: PCYBER Windows RDP + Tailscale + RDP User Applications

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      # =====================================================
      # 1. CONFIGURE WINDOWS RDP AND ADMINISTRATOR ELEVATION
      # =====================================================
      - name: Configure Windows RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $uacPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          # Enable Network Level Authentication
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          # Enable TLS
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 2

          # Keep UAC enabled but automatically approve administrator elevation
          Set-ItemProperty -Path $uacPath -Name "EnableLUA" -Value 1
          Set-ItemProperty -Path $uacPath -Name "ConsentPromptBehaviorAdmin" -Value 0
          Set-ItemProperty -Path $uacPath -Name "PromptOnSecureDesktop" -Value 0

          # Start Remote Desktop service
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          # Remove old firewall rule
          Get-NetFirewallRule -DisplayName "PCYBER-RDP-Tailscale" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          # Allow RDP only through Tailscale IPv4 range
          New-NetFirewallRule `
            -DisplayName "PCYBER-RDP-Tailscale" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          Write-Host "Windows RDP configured."

      # =====================================================
      # 2. CREATE RDP ACCOUNT WITH ADMINISTRATOR ACCESS
      # =====================================================
      - name: Create RDP Administrator Account
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = "RDP"
          $password = "MR.English2008"
          $profilePath = "C:\Users\RDP"

          $securePassword = ConvertTo-SecureString `
            $password -AsPlainText -Force

          # Create or update user
          $existingUser = Get-LocalUser -Name $username `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
              Set-LocalUser -Name $username -Password $securePassword
              Enable-LocalUser -Name $username
          }
          else {
              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -FullName "PCYBER RDP Administrator" `
                -Description "PCYBER Remote Desktop Administrator" `
                -PasswordNeverExpires
          }

          # Resolve local security groups
          $adminGroup = Get-LocalGroup -SID "S-1-5-32-544"
          $rdpGroup = Get-LocalGroup -SID "S-1-5-32-555"

          # Administrator membership
          $adminMember = Get-LocalGroupMember -Group $adminGroup |
            Where-Object { $_.SID.Value -eq (Get-LocalUser RDP).SID.Value }

          if (-not $adminMember) {
              Add-LocalGroupMember -Group $adminGroup -Member $username
          }

          # Remote Desktop membership
          $rdpMember = Get-LocalGroupMember -Group $rdpGroup |
            Where-Object { $_.SID.Value -eq (Get-LocalUser RDP).SID.Value }

          if (-not $rdpMember) {
              Add-LocalGroupMember -Group $rdpGroup -Member $username
          }

          # Create requested profile directory
          New-Item -ItemType Directory -Path $profilePath -Force | Out-Null

          # Set Windows profile path
          $userSid = (Get-LocalUser -Name $username).SID.Value

          $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$userSid"

          New-Item -Path $profileKey -Force | Out-Null

          Set-ItemProperty `
            -Path $profileKey `
            -Name "ProfileImagePath" `
            -Value $profilePath

          # Grant RDP full control over its profile
          $acl = Get-Acl $profilePath

          $rule = New-Object System.Security.AccessControl.FileSystemAccessRule(
              $username,
              "FullControl",
              "ContainerInherit,ObjectInherit",
              "None",
              "Allow"
          )

          $acl.SetAccessRule($rule)
          Set-Acl -Path $profilePath -AclObject $acl

          # Create all user directories
          $directories = @(
              "$profilePath\Desktop",
              "$profilePath\Downloads",
              "$profilePath\Documents",
              "$profilePath\Pictures",
              "$profilePath\Videos",
              "$profilePath\AppData\Local\Temp",
              "$profilePath\AppData\Local\PCYBER",
              "$profilePath\AppData\Roaming\PCYBER",
              "$profilePath\PCYBER"
          )

          foreach ($directory in $directories) {
              New-Item -ItemType Directory -Force -Path $directory | Out-Null
          }

          Write-Host "RDP account created."
          Write-Host "Profile: $profilePath"

          Write-Host "Administrator group:"
          Get-LocalGroupMember -Group $adminGroup

          Write-Host "Remote Desktop group:"
          Get-LocalGroupMember -Group $rdpGroup

      # =====================================================
      # 3. INSTALL TAILSCALE
      # =====================================================
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "C:\Users\RDP\Downloads\tailscale-setup.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" `
            -OutFile $installer

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /qn /norestart" `
            -Wait

          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {
              throw "Tailscale installation failed."
          }

          Write-Host "Tailscale installed."

      # =====================================================
      # 4. CONNECT TAILSCALE
      # =====================================================
      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscaleExe up `
            "--authkey=$env:TAILSCALE_AUTHKEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 10 -and -not $tsIP; $i++) {
              $tsIP = & $tailscaleExe ip -4 |
                Select-Object -First 1

              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
              }
          }

          if (-not $tsIP) {
              throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$tsIP" | Out-File $env:GITHUB_ENV -Append

          Write-Host "======================================"
          Write-Host "TAILSCALE CONNECTED"
          Write-Host "RDP IP: $tsIP"
          Write-Host "USERNAME: RDP"
          Write-Host "PORT: 3389"
          Write-Host "======================================"

      # =====================================================
      # 5. DOWNLOAD PBOT.EXE
      # =====================================================
      - name: Download PCYBER Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $destination = "C:\Users\RDP\Desktop\pbot.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/pcyberict/pcyber-rdp-apps/releases/download/v1.0/pbot.exe" `
            -OutFile $destination

          $expectedHash = "32b69e5102b90d77d521cdd8404511ad1dc031a77c450cf5c80811bc0164cee8"

          $actualHash = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLower()

          if ($actualHash -ne $expectedHash) {
              Remove-Item $destination -Force
              throw "pbot.exe SHA256 verification failed."
          }

          Write-Host "pbot.exe downloaded and verified."

      # =====================================================
      # 6. DOWNLOAD MAC CHANGER
      # =====================================================
      - name: Download MAC Changer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $destination = "C:\Users\RDP\Desktop\mac_changer.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/pcyberict/mcmchanger/releases/download/v1.0/mac_changer.exe" `
            -OutFile $destination

          $signature = Get-Content -Path $destination -Encoding Byte -TotalCount 2

          if ($signature.Length -ne 2 -or
              $signature[0] -ne 0x4D -or
              $signature[1] -ne 0x5A) {

              Remove-Item $destination -Force
              throw "Invalid Windows executable."
          }

          Write-Host "MAC Changer downloaded."

      # =====================================================
      # 7. DOWNLOAD AND EXTRACT PCYBER ZIP FILES
      # =====================================================
      - name: Download and Extract Applications
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $profile = "C:\Users\RDP"
          $downloads = "$profile\Downloads"
          $desktop = "$profile\Desktop"

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          function Download-And-Extract {
              param(
                  [string]$Url,
                  [string]$ZipName,
                  [string]$FolderName
              )

              $zipPath = Join-Path $downloads $ZipName
              $destination = Join-Path $desktop $FolderName

              Write-Host "Downloading $ZipName"

              Invoke-WebRequest -Uri $Url -OutFile $zipPath

              if (-not (Test-Path $zipPath) -or
                  (Get-Item $zipPath).Length -lt 100) {
                  throw "Invalid ZIP download: $ZipName"
              }

              # Validate ZIP entry paths
              $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)

              try {
                  $root = [System.IO.Path]::GetFullPath($destination).TrimEnd('\') + '\'

                  foreach ($entry in $archive.Entries) {
                      $target = [System.IO.Path]::GetFullPath(
                          [System.IO.Path]::Combine($destination, $entry.FullName)
                      )

                      if (-not $target.StartsWith(
                          $root,
                          [System.StringComparison]::OrdinalIgnoreCase
                      )) {
                          throw "Unsafe ZIP entry: $($entry.FullName)"
                      }
                  }
              }
              finally {
                  $archive.Dispose()
              }

              New-Item -ItemType Directory -Force -Path $destination | Out-Null

              Expand-Archive `
                -LiteralPath $zipPath `
                -DestinationPath $destination `
                -Force

              Write-Host "Extracted to: $destination"
          }

          Download-And-Extract `
            -Url "https://github.com/pcyberict/mcmchanger/releases/download/v1.0/pcyber-twist.zip" `
            -ZipName "pcyber-twist.zip" `
            -FolderName "pcyber-twist"

          Download-And-Extract `
            -Url "https://github.com/pcyberict/mcmchanger/releases/download/v1.0/crx.build.zip" `
            -ZipName "crx.build.zip" `
            -FolderName "crx.build"

      # =====================================================
      # 8. DOWNLOAD DOWNLOADS.BAT
      # DO NOT EXECUTE IT AS RUNNERADMIN
      # =====================================================
      - name: Prepare Downloads.bat for RDP User
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $profile = "C:\Users\RDP"
          $downloads = "$profile\Downloads"

          # Per-user Windows Startup directory
          $startup = "$profile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"

          New-Item -ItemType Directory -Force -Path $downloads | Out-Null
          New-Item -ItemType Directory -Force -Path $startup | Out-Null

          $batPath = "$downloads\Downloads.bat"

          Invoke-WebRequest `
            -Uri "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat" `
            -OutFile $batPath

          if (-not (Test-Path $batPath) -or
              (Get-Item $batPath).Length -lt 10) {
              throw "Downloads.bat download failed or is invalid."
          }

          # Create launcher that runs inside the RDP user's session
          $launcher = "$startup\PCYBER-Downloads.cmd"

          @'
          @echo off
          if /I not "%USERNAME%"=="RDP" exit /b 1

          set "PCYBER_PROFILE=C:\Users\RDP"
          set "PCYBER_DOWNLOADS=C:\Users\RDP\Downloads"
          set "PCYBER_DESKTOP=C:\Users\RDP\Desktop"
          set "PCYBER_APPDATA=C:\Users\RDP\AppData\Local\PCYBER"

          if not exist "%PCYBER_DOWNLOADS%\Downloads.bat" exit /b 2

          cd /d "%PCYBER_DOWNLOADS%"

          echo PCYBER Downloads starting...
          echo Current user: %USERNAME%

          call "%PCYBER_DOWNLOADS%\Downloads.bat" >> "%PCYBER_DOWNLOADS%\Downloads.log" 2>&1

          echo Downloads script completed with exit code %ERRORLEVEL% >> "%PCYBER_DOWNLOADS%\Downloads.log"
          '@ | Set-Content -Path $launcher -Encoding ASCII

          Write-Host "Downloads.bat prepared."
          Write-Host "Script: $batPath"
          Write-Host "Startup launcher: $launcher"
          Write-Host "It will execute after RDP logs in as RDP."

      # =====================================================
      # 9. VERIFY ADMINISTRATOR MEMBERSHIP AND RDP
      # =====================================================
      - name: Verify RDP Configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $user = Get-LocalUser -Name "RDP"
          $adminGroup = Get-LocalGroup -SID "S-1-5-32-544"
          $rdpGroup = Get-LocalGroup -SID "S-1-5-32-555"

          $adminMember = Get-LocalGroupMember -Group $adminGroup |
            Where-Object { $_.SID.Value -eq $user.SID.Value }

          $rdpMember = Get-LocalGroupMember -Group $rdpGroup |
            Where-Object { $_.SID.Value -eq $user.SID.Value }

          if (-not $adminMember) {
              throw "RDP is not a member of Administrators."
          }

          if (-not $rdpMember) {
              throw "RDP is not a member of Remote Desktop Users."
          }

          Write-Host "RDP administrator membership verified."
          Write-Host "RDP Remote Desktop membership verified."

          $listener = Get-NetTCPConnection -LocalPort 3389 -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
              throw "RDP port 3389 is not listening."
          }

          Write-Host "RDP port is listening."

          Write-Host "======================================"
          Write-Host "PCYBER RDP READY"
          Write-Host "TAILSCALE IP: $env:TAILSCALE_IP"
          Write-Host "USERNAME: RDP"
          Write-Host "PASSWORD: MR.English2008"
          Write-Host "PROFILE: C:\Users\RDP"
          Write-Host "APPLICATIONS: C:\Users\RDP\Desktop"
          Write-Host "DOWNLOADS: C:\Users\RDP\Downloads"
          Write-Host "ADMINISTRATORS: CONFIRMED"
          Write-Host "======================================"

      # =====================================================
      # 10. MAINTAIN RDP SESSION
      # =====================================================
      - name: Maintain RDP Session
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $endTime = (Get-Date).AddMinutes(350)

          Write-Host "PCYBER RDP is active."
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          while ((Get-Date) -lt $endTime) {

              Write-Host "======================================"
              Write-Host "PCYBER RDP SESSION ACTIVE"
              Write-Host "TIME: $(Get-Date)"
              Write-Host "TAILSCALE IP: $env:TAILSCALE_IP"
              Write-Host "RDP USER: RDP"
              Write-Host "======================================"

              Start-Sleep -Seconds 300
          }

          Write-Host "RDP session keep-alive completed."
