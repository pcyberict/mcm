
name: Windows 11 + Tailscale + PCYBER Downloads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      RDP_USERNAME: RDP
      RDP_PASSWORD: "MR.English2008"
      RDP_PROFILE: 'C:\Users\RDP.runnervmquqza'
      RDP_DESKTOP: 'C:\Users\RDP.runnervmquqza\Desktop'
      RDP_DOWNLOADS: 'C:\Users\RDP.runnervmquqza\Downloads'
      PCYBER_DIR: 'C:\PCYBER'

    steps:

      # ==========================================
      # 1. CREATE RDP USER AND GRANT ADMIN RIGHTS
      # ==========================================

      - name: Configure RDP Administrator Account
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $username = $env:RDP_USERNAME
          $password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          Write-Host "Configuring RDP account..."

          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existingUser) {
              Set-LocalUser -Name $username -Password $password
              Enable-LocalUser -Name $username
              Write-Host "Existing RDP account updated."
          }
          else {
              New-LocalUser `
                -Name $username `
                -Password $password `
                -FullName "PCYBER RDP Administrator" `
                -Description "Remote Desktop Administrator Account" `
                -PasswordNeverExpires `
                -AccountNeverExpires

              Write-Host "New RDP account created."
          }

          $user = Get-LocalUser -Name $username
          $sid = $user.SID.Value

          # Add account to Administrators
          $adminGroup = Get-LocalGroup -SID "S-1-5-32-544"

          $adminMember = Get-LocalGroupMember -Group $adminGroup.Name -ErrorAction SilentlyContinue |
              Where-Object { $_.SID.Value -eq $sid }

          if (-not $adminMember) {
              Add-LocalGroupMember -Group $adminGroup.Name -Member $username
          }

          # Add account to Remote Desktop Users
          $rdpGroup = Get-LocalGroup -SID "S-1-5-32-555"

          $rdpMember = Get-LocalGroupMember -Group $rdpGroup.Name -ErrorAction SilentlyContinue |
              Where-Object { $_.SID.Value -eq $sid }

          if (-not $rdpMember) {
              Add-LocalGroupMember -Group $rdpGroup.Name -Member $username
          }

          # Configure requested Windows profile directory
          $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"

          New-Item -Path $profileKey -Force | Out-Null

          Set-ItemProperty `
            -Path $profileKey `
            -Name "ProfileImagePath" `
            -Value $env:RDP_PROFILE `
            -Force

          # Create required directories
          @(
              $env:RDP_PROFILE,
              $env:RDP_DESKTOP,
              $env:RDP_DOWNLOADS,
              $env:PCYBER_DIR
          ) | ForEach-Object {
              New-Item -ItemType Directory -Path $_ -Force | Out-Null
          }

          # Grant account permissions
          icacls $env:RDP_PROFILE /grant "*${sid}:(OI)(CI)F" /T /C | Out-Null
          icacls $env:PCYBER_DIR /grant "*${sid}:(OI)(CI)F" /T /C | Out-Null

          Write-Host "========================================"
          Write-Host "RDP ACCOUNT CONFIGURED"
          Write-Host "Username: $username"
          Write-Host "Administrator: Enabled"
          Write-Host "Desktop: $env:RDP_DESKTOP"
          Write-Host "========================================"

      # ==========================================
      # 2. ENABLE REMOTE DESKTOP
      # ==========================================

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          $rdpTcp = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"

          # Enable Network Level Authentication
          Set-ItemProperty -Path $rdpTcp -Name "UserAuthentication" -Value 1

          # Secure RDP security layer
          Set-ItemProperty -Path $rdpTcp -Name "SecurityLayer" -Value 2

          # Disable broad default firewall rules
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue |
              Disable-NetFirewallRule

          # Allow RDP only from Tailscale addresses
          Get-NetFirewallRule -DisplayName "PCYBER-RDP-Tailscale" -ErrorAction SilentlyContinue |
              Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName "PCYBER-RDP-Tailscale" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force

          Write-Host "Remote Desktop enabled."

      # ==========================================
      # 3. INSTALL AND CONNECT TAILSCALE
      # ==========================================

      - name: Install and Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $installer = "$env:TEMP\tailscale-setup.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" `
            -OutFile $installer

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /qn" `
            -Wait

          Start-Service -Name Tailscale -ErrorAction SilentlyContinue

          $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {
              throw "Tailscale installation failed."
          }

          & $tailscaleExe up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          Start-Sleep -Seconds 10

          $tailscaleIP = & $tailscaleExe ip -4

          if ([string]::IsNullOrWhiteSpace($tailscaleIP)) {
              throw "Could not obtain Tailscale IPv4 address."
          }

          "TAILSCALE_IP=$tailscaleIP" | Out-File $env:GITHUB_ENV -Append

          Write-Host "Tailscale connected."
          Write-Host "IP: $tailscaleIP"

      # ==========================================
      # 4. DOWNLOAD PCYBER APPLICATIONS
      # ==========================================

      - name: Download PCYBER Applications
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $downloadDir = $env:RDP_DOWNLOADS

          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          New-Item -ItemType Directory -Path $env:PCYBER_DIR -Force | Out-Null

          function Download-File {
              param(
                  [string]$Url,
                  [string]$FileName
              )

              $destination = Join-Path $downloadDir $FileName

              Write-Host "Downloading $FileName"

              Invoke-WebRequest `
                -Uri $Url `
                -OutFile $destination `
                -UseBasicParsing

              if (-not (Test-Path $destination)) {
                  throw "Download failed: $FileName"
              }

              if ((Get-Item $destination).Length -le 0) {
                  throw "Downloaded file is empty: $FileName"
              }

              Write-Host "Downloaded successfully: $FileName"

              return $destination
          }

          # PCYBER BOT
          $pbot = Download-File `
            -Url "https://github.com/pcyberict/pcyber-rdp-apps/releases/download/v1.0/pbot.exe" `
            -FileName "pbot.exe"

          # Verify PCYBER BOT SHA256
          $expectedHash = "32b69e5102b90d77d521cdd8404511ad1dc031a77c450cf5c80811bc0164cee8"
          $actualHash = (Get-FileHash -Path $pbot -Algorithm SHA256).Hash.ToLower()

          if ($actualHash -ne $expectedHash) {
              throw "pbot.exe SHA256 verification failed."
          }

          # MAC CHANGER
          $macChanger = Download-File `
            -Url "https://github.com/pcyberict/mcmchanger/releases/download/v1.0/mac_changer.exe" `
            -FileName "mac_changer.exe"

          # UPDATED CRX BUILD ZIP
          $crxZip = Download-File `
            -Url "https://github.com/pcyberict/mcmchanger/releases/download/v1.0/crx.build.zip" `
            -FileName "crx.build.zip"

          # UPDATED PCYBER TWIST ZIP
          $twistZip = Download-File `
            -Url "https://github.com/pcyberict/mcmchanger/releases/download/v1.0/pcyber-twist.zip" `
            -FileName "pcyber-twist.zip"

          # Validate executable signatures
          foreach ($exe in @($pbot, $macChanger)) {
              $signature = [System.IO.File]::ReadAllBytes($exe)

              if ($signature.Length -lt 2 -or
                  $signature[0] -ne 0x4D -or
                  $signature[1] -ne 0x5A) {
                  throw "Invalid Windows executable: $exe"
              }
          }

          Write-Host "All PCYBER downloads completed."

      # ==========================================
      # 5. SAFELY EXTRACT ZIP FILES
      # ==========================================

      - name: Extract ZIP Files to Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Add-Type -AssemblyName System.IO.Compression

          $downloadDir = $env:RDP_DOWNLOADS
          $desktop = $env:RDP_DESKTOP

          function Expand-SafeZip {
              param(
                  [string]$ZipPath,
                  [string]$Destination
              )

              Write-Host "Extracting $ZipPath"

              New-Item -ItemType Directory -Path $Destination -Force | Out-Null

              $root = [System.IO.Path]::GetFullPath($Destination)
              $rootPrefix = $root.TrimEnd('\') + '\'

              $archive = [System.IO.Compression.ZipFile]::OpenRead($ZipPath)

              try {
                  foreach ($entry in $archive.Entries) {
                      $target = [System.IO.Path]::GetFullPath(
                          (Join-Path $root $entry.FullName)
                      )

                      if (-not $target.StartsWith(
                          $rootPrefix,
                          [System.StringComparison]::OrdinalIgnoreCase
                      )) {
                          throw "Unsafe ZIP entry detected: $($entry.FullName)"
                      }

                      if ([string]::IsNullOrEmpty($entry.Name)) {
                          New-Item -ItemType Directory -Path $target -Force | Out-Null
                          continue
                      }

                      New-Item -ItemType Directory `
                        -Path (Split-Path $target -Parent) `
                        -Force | Out-Null

                      $inputStream = $entry.Open()

                      try {
                          $outputStream = [System.IO.File]::Create($target)

                          try {
                              $inputStream.CopyTo($outputStream)
                          }
                          finally {
                              $outputStream.Dispose()
                          }
                      }
                      finally {
                          $inputStream.Dispose()
                      }
                  }
              }
              finally {
                  $archive.Dispose()
              }

              # Remove one wrapper folder if the archive has only one
              $items = @(Get-ChildItem -LiteralPath $Destination -Force)

              if ($items.Count -eq 1 -and $items[0].PSIsContainer) {
                  $source = $items[0].FullName
              }
              else {
                  $source = $Destination
              }

              Get-ChildItem -LiteralPath $source -Force |
                  Copy-Item -Destination $desktop -Recurse -Force

              Write-Host "Extraction completed."
          }

          $zipFiles = @(
              (Join-Path $downloadDir "crx.build.zip"),
              (Join-Path $downloadDir "pcyber-twist.zip")
          )

          foreach ($zip in $zipFiles) {
              if (-not (Test-Path $zip)) {
                  throw "ZIP file not found: $zip"
              }

              $folderName = [System.IO.Path]::GetFileNameWithoutExtension($zip)
              $extractPath = Join-Path $env:PCYBER_DIR $folderName

              Expand-SafeZip -ZipPath $zip -Destination $extractPath
          }

          Write-Host "Both updated ZIP packages extracted successfully."

      # ==========================================
      # 6. COPY APPLICATIONS TO DESKTOP
      # ==========================================

      - name: Copy Applications to RDP Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $files = @(
              "pbot.exe",
              "mac_changer.exe"
          )

          foreach ($file in $files) {
              $source = Join-Path $env:RDP_DOWNLOADS $file
              $destination = Join-Path $env:RDP_DESKTOP $file

              if (-not (Test-Path $source)) {
                  throw "Missing application: $source"
              }

              Copy-Item -Path $source -Destination $destination -Force

              Write-Host "Copied to Desktop: $file"
          }

      # ==========================================
      # 7. DOWNLOAD AND RUN DOWNLOADS.BAT
      # ==========================================

      - name: Download and Run Downloads BAT
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $batUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"

          $batPath = Join-Path $env:RDP_DOWNLOADS "Downloads.bat"

          Invoke-WebRequest `
            -Uri $batUrl `
            -OutFile $batPath `
            -UseBasicParsing

          if (-not (Test-Path $batPath)) {
              throw "Downloads.bat was not downloaded."
          }

          $startupDir = Join-Path $env:RDP_PROFILE `
              "AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"

          New-Item -ItemType Directory -Path $startupDir -Force | Out-Null

          Copy-Item `
            -Path $batPath `
            -Destination (Join-Path $startupDir "Downloads.bat") `
            -Force

          Write-Host "Running Downloads.bat..."

          $process = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList "/c `"$batPath`"" `
            -WorkingDirectory $env:RDP_DOWNLOADS `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "Downloads.bat exit code: $($process.ExitCode)"

          # Extract additional ZIP files downloaded by BAT
          $additionalZips = Get-ChildItem `
            -Path $env:RDP_DOWNLOADS `
            -Filter "*.zip" `
            -File `
            -Recurse

          Add-Type -AssemblyName System.IO.Compression

          foreach ($zip in $additionalZips) {
              $folderName = [System.IO.Path]::GetFileNameWithoutExtension($zip.Name)
              $destination = Join-Path $env:PCYBER_DIR "Additional_$folderName"

              New-Item -ItemType Directory -Path $destination -Force | Out-Null

              $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)

              try {
                  $root = [System.IO.Path]::GetFullPath($destination)
                  $prefix = $root.TrimEnd('\') + '\'

                  foreach ($entry in $archive.Entries) {
                      $target = [System.IO.Path]::GetFullPath(
                          (Join-Path $root $entry.FullName)
                      )

                      if (-not $target.StartsWith(
                          $prefix,
                          [System.StringComparison]::OrdinalIgnoreCase
                      )) {
                          throw "Unsafe ZIP entry: $($entry.FullName)"
                      }

                      if ([string]::IsNullOrEmpty($entry.Name)) {
                          New-Item -ItemType Directory -Path $target -Force | Out-Null
                          continue
                      }

                      New-Item -ItemType Directory `
                        -Path (Split-Path $target -Parent) `
                        -Force | Out-Null

                      $inputStream = $entry.Open()

                      try {
                          $outputStream = [System.IO.File]::Create($target)

                          try {
                              $inputStream.CopyTo($outputStream)
                          }
                          finally {
                              $outputStream.Dispose()
                          }
                      }
                      finally {
                          $inputStream.Dispose()
                      }
                  }
              }
              finally {
                  $archive.Dispose()
              }

              Get-ChildItem -LiteralPath $destination -Force |
                  Copy-Item -Destination $env:RDP_DESKTOP -Recurse -Force

              Write-Host "Additional ZIP extracted: $($zip.Name)"
          }

          # Copy additional non-ZIP downloads to Desktop
          Get-ChildItem -Path $env:RDP_DOWNLOADS -File -Recurse |
              Where-Object {
                  $_.Extension -ne ".zip" -and
                  $_.Name -ne "Downloads.bat"
              } |
              ForEach-Object {
                  Copy-Item -Path $_.FullName `
                    -Destination $env:RDP_DESKTOP `
                    -Force
              }

          Write-Host "Downloads.bat processing completed."

      # ==========================================
      # 8. VERIFY RDP AND DISPLAY DETAILS
      # ==========================================

      - name: Verify RDP and Display Connection Details
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "         PCYBER WINDOWS RDP READY"
          Write-Host "=============================================="

          Write-Host "RDP IP ADDRESS:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "RDP PORT: 3389"
          Write-Host "USERNAME: $env:RDP_USERNAME"
          Write-Host "DESKTOP: $env:RDP_DESKTOP"
          Write-Host "ADMINISTRATOR: Enabled"

          Write-Host ""
          Write-Host "DESKTOP FILES:"

          Get-ChildItem -Path $env:RDP_DESKTOP -Force |
              Select-Object Name, Length, LastWriteTime |
              Format-Table -AutoSize

          $connection = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $connection.TcpTestSucceeded) {
              throw "RDP port 3389 is not responding."
          }

          Write-Host "RDP service is responding."

      # ==========================================
      # 9. KEEP RDP RUNNING FOR 360 MINUTES
      # ==========================================

      - name: Keep RDP Session Alive
        shell: powershell
        run: |
          Write-Host "=============================================="
          Write-Host "PCYBER RDP SESSION IS ACTIVE"
          Write-Host "Maximum workflow duration: 360 minutes"
          Write-Host "=============================================="

          while ($true) {
              Write-Host ""
              Write-Host "RDP is still running..."
              Write-Host "Tailscale IP: $env:TAILSCALE_IP"
              Write-Host "Current time: $(Get-Date)"

              Start-Sleep -Seconds 300
          }
