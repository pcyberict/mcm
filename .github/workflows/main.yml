
name: win 11 + tailscale + Download.bat script + PCYBER Apps

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. CONFIGURE CORE RDP SETTINGS
      # ==========================================
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      # ==========================================
      # 2. CREATE RDP USER
      # ==========================================
      - name: Create RDP User with Fixed Password
        shell: pwsh
        run: |
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          else {
              Set-LocalUser -Name "RDP" -Password $securePass
          }

          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

          Write-Host "RDP user created successfully."

      # ==========================================
      # 3. INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force

      # ==========================================
      # 4. ESTABLISH TAILSCALE CONNECTION
      # ORIGINAL WORKING COMMAND PRESERVED
      # ==========================================
      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
              }

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP: $tsIP"

      # ==========================================
      # 5. CREATE APPLICATION DIRECTORY
      # ==========================================
      - name: Create PCYBER Application Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "C:\PCYBER" -Force | Out-Null

          Write-Host "PCYBER application directory created."

      # ==========================================
      # 6. DOWNLOAD PCYBER APPLICATION
      # ==========================================
      - name: Download PCYBER Application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $downloadUrl = "https://github.com/pcyberict/pcyber-rdp-apps/releases/download/v1.0/pbot.exe"
          $downloadPath = "C:\PCYBER\pbot.exe"

          Write-Host "Downloading PCYBER application..."

          Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath

          if (-not (Test-Path $downloadPath)) {
              throw "PCYBER application download failed."
          }

          $fileSize = (Get-Item $downloadPath).Length

          Write-Host "Downloaded size: $([math]::Round($fileSize / 1MB, 2)) MB"

          if ($fileSize -lt 900MB) {
              throw "Downloaded PCYBER application is too small."
          }

          $actualHash = (Get-FileHash -Path $downloadPath -Algorithm SHA256).Hash.ToLower()

          $expectedHash = "32b69e5102b90d77d521cdd8404511ad1dc031a77c450cf5c80811bc0164cee8"

          if ($actualHash -ne $expectedHash) {
              throw "PCYBER application SHA256 verification failed."
          }

          Write-Host "PCYBER application downloaded and verified successfully."

      # ==========================================
      # 7. DOWNLOAD MAC CHANGER APPLICATION
      # ==========================================
      - name: Download MAC Changer Application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $downloadUrl = "https://github.com/pcyberict/mcmchanger/releases/download/v1.0/mac_changer.exe"
          $downloadPath = "C:\PCYBER\mac_changer.exe"

          Write-Host "Downloading MAC Changer application..."

          Invoke-WebRequest `
            -Uri $downloadUrl `
            -OutFile $downloadPath

          if (-not (Test-Path $downloadPath)) {
              throw "MAC Changer download failed."
          }

          $file = Get-Item $downloadPath

          if ($file.Length -lt 10KB) {
              throw "MAC Changer executable is too small or incomplete."
          }

          # Verify Windows executable signature header
          $stream = [System.IO.File]::OpenRead($downloadPath)

          try {
              $header = New-Object byte[] 2
              [void]$stream.Read($header, 0, 2)
          }
          finally {
              $stream.Dispose()
          }

          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
              throw "Downloaded MAC Changer is not a valid Windows executable."
          }

          Write-Host "MAC Changer downloaded successfully."
          Write-Host "File: $downloadPath"
          Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB"

      # ==========================================
      # 8. VERIFY RDP ACCESSIBILITY
      # ==========================================
      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }

          Write-Host "TCP connectivity successful!"

      # ==========================================
      # 9. MAINTAIN CONNECTION + WATCH RDP USER
      # ==========================================
      - name: Maintain Connection + Watch RDP User
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"

          Write-Host "======================================"
          Write-Host "INSTALLED APPLICATIONS"
          Write-Host "======================================"
          Write-Host "PCYBER App: C:\PCYBER\pbot.exe"
          Write-Host "MAC Changer: C:\PCYBER\mac_changer.exe"
          Write-Host "======================================"

          $rdpProfile = "C:\Users\RDP"

          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"

          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"

          $downloadPath = "$startupPath\Downloads.bat"

          while ($true) {

              if (Test-Path $rdpProfile) {

                  try {
                      if (-not (Test-Path $startupPath)) {
                          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                      }

                      Invoke-WebRequest `
                        -Uri $downloadUrl `
                        -OutFile $downloadPath `
                        -UseBasicParsing

                      Write-Host "Downloads.bat copied to $downloadPath"

                      cmd /c $downloadPath

                      Write-Host "Downloads.bat executed successfully"

                      break
                  }
                  catch {
                      Write-Host "Error copying or executing Downloads.bat: $($_.Exception.Message)"
                      break
                  }
              }
              else {
                  Write-Host "[$(Get-Date)] Waiting for RDP profile to be created..."
                  Start-Sleep -Seconds 30
              }
          }

          # Keep runner alive
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
