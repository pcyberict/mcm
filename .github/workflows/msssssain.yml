
name: PCYBER Windows RDP + Tailscale + Admin Access

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      # =====================================================
      # 1. CONFIGURE RDP AND UAC
      # =====================================================
      - name: Configure Windows RDP and Administrator Elevation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          # Require Network Level Authentication
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          # TLS security layer
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 2

          # Configure UAC administrator elevation:
          # Administrator elevation requests are approved automatically.
          $uacPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"

          Set-ItemProperty -Path $uacPath -Name "EnableLUA" -Value 1
          Set-ItemProperty -Path $uacPath -Name "ConsentPromptBehaviorAdmin" -Value 0
          Set-ItemProperty -Path $uacPath -Name "PromptOnSecureDesktop" -Value 0

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          # Configure firewall for Tailscale RDP connections only
          Get-NetFirewallRule -DisplayName "PCYBER-RDP-Tailscale" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName "PCYBER-RDP-Tailscale" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          Write-Host "RDP and administrator elevation configured."

      # =====================================================
      # 2. CREATE RDP USER WITH ADMINISTRATOR MEMBERSHIP
      # =====================================================
      - name: Create RDP Administrator Account
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = "RDP"
          $password = "MR.English2008"
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existingUser) {
              Set-LocalUser -Name $username -Password $securePassword
              Enable-LocalUser -Name $username
          }
          else {
              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -FullName "PCYBER Administrator" `
                -Description "PCYBER Remote Desktop Administrator" `
                -PasswordNeverExpires
          }

          # Resolve local groups using their well-known SIDs
          $adminGroup = Get-LocalGroup -SID "S-1-5-32-544"
          $rdpGroup = Get-LocalGroup -SID "S-1-5-32-555"

          # Add account to Administrators
          $adminMember = Get-LocalGroupMember -Group $adminGroup |
            Where-Object { $_.Name -match '\\RDP$' }

          if (-not $adminMember) {
              Add-LocalGroupMember -Group $adminGroup -Member $username
          }

          # Add account to Remote Desktop Users
          $rdpMember = Get-LocalGroupMember -Group $rdpGroup |
            Where-Object { $_.Name -match '\\RDP$' }

          if (-not $rdpMember) {
              Add-LocalGroupMember -Group $rdpGroup -Member $username
          }

          # Configure requested profile location
          $profilePath = "C:\Users\RDP"
          New-Item -ItemType Directory -Path $profilePath -Force | Out-Null

          $userSid = (Get-LocalUser -Name $username).SID.Value
          $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$userSid"

          New-Item -Path $profileKey -Force | Out-Null

          Set-ItemProperty `
            -Path $profileKey `
            -Name "ProfileImagePath" `
            -Value $profilePath

          # Grant RDP full control over its profile directory
          $acl = Get-Acl $profilePath

          $rule = New-Object System.Security.AccessControl.FileSystemAccessRule(
              $username,
              "FullControl",
              "ContainerInherit,ObjectInherit",
              "None",
              "Allow"
          )

          $acl.SetAccessRule($rule)
          Set-Acl -Path $profilePath -AclObject $acl

          New-Item -ItemType Directory -Force -Path "$profilePath\Desktop" | Out-Null
          New-Item -ItemType Directory -Force -Path "$profilePath\Downloads" | Out-Null

          Write-Host "RDP account created and configured."

          Write-Host "Administrators membership:"
          Get-LocalGroupMember -Group $adminGroup

          Write-Host "Remote Desktop Users membership:"
          Get-LocalGroupMember -Group $rdpGroup

      # =====================================================
      # 3. INSTALL TAILSCALE
      # =====================================================
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale-setup.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" `
            -OutFile $installer

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /qn /norestart" `
            -Wait

          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {
              throw "Tailscale installation failed."
          }

          Write-Host "Tailscale installed successfully."

      # =====================================================
      # 4. CONNECT TAILSCALE
      # =====================================================
      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscaleExe up `
            "--authkey=$env:TAILSCALE_AUTHKEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 10 -and -not $tsIP; $i++) {
              $tsIP = & $tailscaleExe ip -4 |
                Select-Object -First 1

              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
              }
          }

          if (-not $tsIP) {
              throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$tsIP" | Out-File $env:GITHUB_ENV -Append

          Write-Host "======================================"
          Write-Host "TAILSCALE CONNECTED"
          Write-Host "RDP IP: $tsIP"
          Write-Host "USERNAME: RDP"
          Write-Host "PORT: 3389"
          Write-Host "======================================"

      # =====================================================
      # 5. PREPARE DIRECTORIES
      # =====================================================
      - name: Prepare PCYBER Directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $profile = "C:\Users\RDP"

          New-Item -ItemType Directory -Force -Path "$profile\Desktop" | Out-Null
          New-Item -ItemType Directory -Force -Path "$profile\Downloads" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\PCYBER" | Out-Null

          Write-Host "Profile: $profile"
          Write-Host "Desktop: $profile\Desktop"
          Write-Host "Downloads: $profile\Downloads"

      # =====================================================
      # 6. DOWNLOAD PBOT AND VERIFY HASH
      # =====================================================
      - name: Download PCYBER Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/pcyberict/pcyber-rdp-apps/releases/download/v1.0/pbot.exe"
          $destination = "C:\Users\RDP\Desktop\pbot.exe"

          Invoke-WebRequest -Uri $url -OutFile $destination

          $expectedHash = "32b69e5102b90d77d521cdd8404511ad1dc031a77c450cf5c80811bc0164cee8"
          $actualHash = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLower()

          if ($actualHash -ne $expectedHash) {
              Remove-Item $destination -Force
              throw "pbot.exe SHA256 verification failed."
          }

          Write-Host "pbot.exe verified successfully."

      # =====================================================
      # 7. DOWNLOAD MAC CHANGER
      # =====================================================
      - name: Download MAC Changer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/pcyberict/mcmchanger/releases/download/v1.0/mac_changer.exe"
          $destination = "C:\Users\RDP\Desktop\mac_changer.exe"

          Invoke-WebRequest -Uri $url -OutFile $destination

          $signature = Get-Content -Path $destination -Encoding Byte -TotalCount 2

          if ($signature.Length -ne 2 -or
              $signature[0] -ne 0x4D -or
              $signature[1] -ne 0x5A) {
              Remove-Item $destination -Force
              throw "Invalid Windows executable."
          }

          Write-Host "MAC Changer downloaded."

      # =====================================================
      # 8. DOWNLOAD AND EXTRACT ZIP APPLICATIONS
      # =====================================================
      - name: Download and Extract PCYBER ZIP Applications
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $desktop = "C:\Users\RDP\Desktop"
          $temp = "C:\PCYBER\Downloads"

          New-Item -ItemType Directory -Force -Path $temp | Out-Null

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          function Download-And-Extract {
              param(
                  [string]$Url,
                  [string]$ZipName,
                  [string]$ExtractFolder
              )

              $zipPath = Join-Path $temp $ZipName
              $destination = Join-Path $desktop $ExtractFolder

              Invoke-WebRequest -Uri $Url -OutFile $zipPath

              if (-not (Test-Path $zipPath) -or
                  (Get-Item $zipPath).Length -lt 100) {
                  throw "Invalid ZIP download: $ZipName"
              }

              # Prevent ZIP path traversal
              $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)

              try {
                  $root = [System.IO.Path]::GetFullPath($destination).TrimEnd('\') + '\'

                  foreach ($entry in $archive.Entries) {
                      $target = [System.IO.Path]::GetFullPath(
                          [System.IO.Path]::Combine($destination, $entry.FullName)
                      )

                      if (-not $target.StartsWith(
                          $root,
                          [System.StringComparison]::OrdinalIgnoreCase
                      )) {
                          throw "Unsafe ZIP entry: $($entry.FullName)"
                      }
                  }
              }
              finally {
                  $archive.Dispose()
              }

              New-Item -ItemType Directory -Force -Path $destination | Out-Null

              Expand-Archive -LiteralPath $zipPath -DestinationPath $destination -Force

              Write-Host "Extracted: $ZipName"
              Write-Host "Location: $destination"
          }

          Download-And-Extract `
            -Url "https://github.com/pcyberict/mcmchanger/releases/download/v1.0/pcyber-twist.zip" `
            -ZipName "pcyber-twist.zip" `
            -ExtractFolder "pcyber-twist"

          Download-And-Extract `
            -Url "https://github.com/pcyberict/mcmchanger/releases/download/v1.0/crx.build.zip" `
            -ZipName "crx.build.zip" `
            -ExtractFolder "crx.build"

      # =====================================================
      # 9. DOWNLOAD DOWNLOADS.BAT
      # =====================================================
      - name: Download PCYBER Downloads Script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"

          $downloads = "C:\Users\RDP\Downloads"
          $startup = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Startup"

          New-Item -ItemType Directory -Force -Path $downloads | Out-Null
          New-Item -ItemType Directory -Force -Path $startup | Out-Null

          $batPath = Join-Path $downloads "Downloads.bat"

          Invoke-WebRequest -Uri $url -OutFile $batPath

          if ((Get-Item $batPath).Length -lt 10) {
              throw "Downloads.bat is empty or invalid."
          }

          Copy-Item $batPath (Join-Path $startup "Downloads.bat") -Force

          Write-Host "Downloads.bat installed."

      # =====================================================
      # 10. VERIFY ADMINISTRATOR CONFIGURATION
      # =====================================================
      - name: Verify Administrator Configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $adminGroup = Get-LocalGroup -SID "S-1-5-32-544"
          $rdpGroup = Get-LocalGroup -SID "S-1-5-32-555"

          $adminMember = Get-LocalGroupMember -Group $adminGroup |
            Where-Object { $_.Name -match '\\RDP$' }

          $rdpMember = Get-LocalGroupMember -Group $rdpGroup |
            Where-Object { $_.Name -match '\\RDP$' }

          if (-not $adminMember) {
              throw "RDP is not in the Administrators group."
          }

          if (-not $rdpMember) {
              throw "RDP is not in Remote Desktop Users."
          }

          $uacPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"

          $enableLUA = (Get-ItemProperty $uacPath).EnableLUA
          $adminPrompt = (Get-ItemProperty $uacPath).ConsentPromptBehaviorAdmin

          if ($enableLUA -ne 1 -or $adminPrompt -ne 0) {
              throw "Administrator elevation policy was not configured correctly."
          }

          Write-Host "RDP belongs to Administrators."
          Write-Host "RDP belongs to Remote Desktop Users."
          Write-Host "Administrator elevation requests are configured for automatic approval."
          Write-Host "Profile: C:\Users\RDP"

          $listener = Get-NetTCPConnection -LocalPort 3389 -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
              throw "RDP port 3389 is not listening."
          }

          Write-Host "RDP port 3389 is listening."

          Write-Host "======================================"
          Write-Host "PCYBER RDP READY"
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "USERNAME: RDP"
          Write-Host "PASSWORD: MR.English2008"
          Write-Host "PROFILE: C:\Users\RDP"
          Write-Host "ADMINISTRATOR GROUP: CONFIRMED"
          Write-Host "======================================"

      # =====================================================
      # 11. KEEP RUNNER ALIVE
      # =====================================================
      - name: Maintain RDP Session
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $endTime = (Get-Date).AddMinutes(350)

          Write-Host "PCYBER RDP session is active."

          while ((Get-Date) -lt $endTime) {
              Write-Host "======================================"
              Write-Host "PCYBER RDP ACTIVE"
              Write-Host "TIME: $(Get-Date)"
              Write-Host "TAILSCALE IP: $env:TAILSCALE_IP"
              Write-Host "USERNAME: RDP"
              Write-Host "======================================"

              Start-Sleep -Seconds 300
          }

          Write-Host "Keep-alive period completed."
